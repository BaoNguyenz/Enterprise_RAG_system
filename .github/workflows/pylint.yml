name: Pylint Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
          uv pip install pylint

      - name: Run Pylint
        run: |
          uv run pylint src app.py main.py \
            --disable=missing-docstring,line-too-long,too-few-public-methods,duplicate-code,broad-exception-caught \
            --fail-under=7.5
